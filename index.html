<!DOCTYPE html>
<html lang="zh-TW" data-theme="tech">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角測量師的幾何密室：探索正弦定理</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- 引入 KaTeX 用於真實 LaTeX 數學公式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        /* ==================== 三大主題風格系統 (高對比色彩校正) ==================== */
        :root, [data-theme="tech"] {
            --bg-main: #0B0F19;
            --text-main: #F8FAFC;
            --text-sub: #CBD5E1;
            --text-muted: #94A3B8;
            --card-bg: rgba(15, 23, 42, 0.82);
            --panel-bg: rgba(30, 41, 59, 0.70);
            --canvas-bg: #070B14;
            --border-color: rgba(148, 163, 184, 0.20);
            --grid-line: rgba(255, 255, 255, 0.03);
            --secret-bg: #0F1523;
            --secret-text: #172036;
            --secret-border: #131B2E;
            --font-display: 'Noto Sans TC', sans-serif;
        }

        /* 風格 2：日式極簡風 (高對比深色字體校正) */
        [data-theme="zen"] {
            --bg-main: #F5F4F0;
            --text-main: #18181B;
            --text-sub: #27272A;
            --text-muted: #52525B;
            --card-bg: rgba(255, 255, 255, 0.95);
            --panel-bg: rgba(244, 243, 238, 0.95);
            --canvas-bg: #18181B;
            --border-color: rgba(113, 113, 122, 0.28);
            --grid-line: rgba(24, 24, 27, 0.04);
            --secret-bg: #EFECE6;
            --secret-text: #E4E0D8;
            --secret-border: #E8E4DC;
            --font-display: 'Noto Sans TC', sans-serif;
        }

        /* 風格 3：羊皮紙測量風 (古典深棕高對比校正) */
        [data-theme="parchment"] {
            --bg-main: #EDE3CE;
            --text-main: #26170C;
            --text-sub: #3D2616;
            --text-muted: #664930;
            --card-bg: rgba(247, 240, 224, 0.95);
            --panel-bg: rgba(235, 224, 200, 0.92);
            --canvas-bg: #1F1610;
            --border-color: rgba(120, 90, 64, 0.35);
            --grid-line: rgba(92, 64, 40, 0.06);
            --secret-bg: #E6DAC2;
            --secret-text: #DACBB0;
            --secret-border: #E0D2B8;
            --font-display: 'Noto Serif TC', serif;
        }

        body {
            font-family: var(--font-display);
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ==================== 淺色主題 (日式風 / 羊皮紙風) 色彩深度強化 ==================== */
        [data-theme="zen"] .text-white,
        [data-theme="parchment"] .text-white {
            color: var(--text-main) !important;
        }
        [data-theme="zen"] .text-slate-100,
        [data-theme="zen"] .text-slate-200,
        [data-theme="zen"] .text-slate-300,
        [data-theme="parchment"] .text-slate-100,
        [data-theme="parchment"] .text-slate-200,
        [data-theme="parchment"] .text-slate-300 {
            color: var(--text-sub) !important;
        }
        [data-theme="zen"] .text-slate-400,
        [data-theme="parchment"] .text-slate-400 {
            color: var(--text-muted) !important;
        }

        [data-theme="zen"] .text-sky-200, [data-theme="zen"] .text-sky-300, [data-theme="zen"] .text-sky-400,
        [data-theme="parchment"] .text-sky-200, [data-theme="parchment"] .text-sky-300, [data-theme="parchment"] .text-sky-400 {
            color: #0369A1 !important;
            font-weight: 700;
        }
        [data-theme="zen"] .text-amber-200, [data-theme="zen"] .text-amber-300, [data-theme="zen"] .text-amber-400,
        [data-theme="parchment"] .text-amber-200, [data-theme="parchment"] .text-amber-300, [data-theme="parchment"] .text-amber-400 {
            color: #92400E !important;
            font-weight: 700;
        }
        [data-theme="zen"] .text-emerald-200, [data-theme="zen"] .text-emerald-300, [data-theme="zen"] .text-emerald-400,
        [data-theme="parchment"] .text-emerald-200, [data-theme="parchment"] .text-emerald-300, [data-theme="parchment"] .text-emerald-400 {
            color: #065F46 !important;
            font-weight: 700;
        }
        [data-theme="zen"] .text-indigo-200, [data-theme="zen"] .text-indigo-300, [data-theme="zen"] .text-indigo-400,
        [data-theme="zen"] .text-purple-200, [data-theme="zen"] .text-purple-300, [data-theme="zen"] .text-purple-400,
        [data-theme="parchment"] .text-indigo-200, [data-theme="parchment"] .text-indigo-300, [data-theme="parchment"] .text-indigo-400,
        [data-theme="parchment"] .text-purple-200, [data-theme="parchment"] .text-purple-300, [data-theme="parchment"] .text-purple-400 {
            color: #4C1D95 !important;
            font-weight: 700;
        }
        [data-theme="zen"] .text-rose-200, [data-theme="zen"] .text-rose-300, [data-theme="zen"] .text-rose-400,
        [data-theme="parchment"] .text-rose-200, [data-theme="parchment"] .text-rose-300, [data-theme="parchment"] .text-rose-400 {
            color: #9F1239 !important;
            font-weight: 700;
        }

        [data-theme="zen"] .bg-slate-900, [data-theme="zen"] .bg-slate-900\/90, [data-theme="zen"] .bg-slate-900\/80, [data-theme="zen"] .bg-slate-900\/70,
        [data-theme="zen"] .bg-slate-950\/50, [data-theme="zen"] .bg-slate-950\/75,
        [data-theme="zen"] .bg-slate-800, [data-theme="zen"] .bg-slate-800\/90 {
            background-color: #E4E2DD !important;
            border-color: #A1A1AA !important;
            color: #18181B !important;
        }
        [data-theme="parchment"] .bg-slate-900, [data-theme="parchment"] .bg-slate-900\/90, [data-theme="parchment"] .bg-slate-900\/80, [data-theme="parchment"] .bg-slate-900\/70,
        [data-theme="parchment"] .bg-slate-950\/50, [data-theme="parchment"] .bg-slate-950\/75,
        [data-theme="parchment"] .bg-slate-800, [data-theme="parchment"] .bg-slate-800\/90 {
            background-color: #DFD1B4 !important;
            border-color: #9C7A54 !important;
            color: #26170C !important;
        }

        [data-theme="zen"] .bg-sky-500\/30, [data-theme="parchment"] .bg-sky-500\/30 {
            background-color: rgba(3, 105, 161, 0.18) !important;
            border-color: #0369A1 !important;
            color: #0369A1 !important;
        }
        [data-theme="zen"] .bg-purple-500\/30, [data-theme="parchment"] .bg-purple-500\/30 {
            background-color: rgba(109, 40, 217, 0.18) !important;
            border-color: #5B21B6 !important;
            color: #4C1D95 !important;
        }
        [data-theme="zen"] .bg-rose-500\/30, [data-theme="parchment"] .bg-rose-500\/30 {
            background-color: rgba(190, 18, 60, 0.18) !important;
            border-color: #BE123C !important;
            color: #9F1239 !important;
        }
        [data-theme="zen"] .bg-amber-500\/30, [data-theme="parchment"] .bg-amber-500\/30 {
            background-color: rgba(180, 83, 9, 0.20) !important;
            border-color: #B45309 !important;
            color: #78350F !important;
        }
        [data-theme="zen"] .bg-emerald-500\/30, [data-theme="parchment"] .bg-emerald-500\/30 {
            background-color: rgba(4, 120, 87, 0.18) !important;
            border-color: #047857 !important;
            color: #065F46 !important;
        }

        /* 保持 SVG 幾何畫布在所有主題皆為高對比深色黑板 */
        .svg-board {
            background-color: var(--canvas-bg) !important;
        }
        .svg-board .board-text-light {
            color: #E2E8F0 !important;
        }
        .svg-board .board-text-sky {
            color: #38BDF8 !important;
        }
        .svg-board .board-text-amber {
            color: #FBBF24 !important;
        }
        .svg-board .board-text-purple {
            color: #C084FC !important;
        }
        .svg-board .board-text-rose {
            color: #FB7185 !important;
        }

        .font-mono-math {
            font-family: 'JetBrains Mono', monospace;
        }
        .bg-grid-pattern {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
            50% { transform: scale(1.08) translate(12px, -12px); opacity: 0.45; }
        }
        .glow-blob {
            animation: pulse-slow 8s infinite ease-in-out;
        }
        [data-theme="zen"] .glow-blob,
        [data-theme="parchment"] .glow-blob {
            opacity: 0.08;
        }
        @keyframes float-badge {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }
        .float-anim {
            animation: float-badge 4s infinite ease-in-out;
        }
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(100, 116, 139, 0.45);
            height: 8px;
            border-radius: 999px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #38BDF8;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.85);
            border: 2px solid #fff;
            transition: transform 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.18);
        }
        .secret-teacher-trigger {
            background-color: var(--secret-bg);
            color: var(--secret-text);
            border: 1px solid var(--secret-border);
            cursor: default;
            user-select: none;
        }
        .katex { font-size: 1.08em; }
    </style>
</head>
<body class="min-h-screen bg-grid-pattern relative flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <!-- 背景裝飾光暈 -->
    <div class="fixed top-[-10%] left-[-5%] w-96 h-96 rounded-full bg-indigo-600/30 blur-[110px] pointer-events-none glow-blob"></div>
    <div class="fixed bottom-[-10%] right-[-5%] w-[28rem] h-[28rem] rounded-full bg-sky-500/20 blur-[120px] pointer-events-none glow-blob" style="animation-delay: 3s;"></div>

    <!-- ================= 教師外掛隱藏控制列 (預設隱藏) ================= -->
    <div id="teacher-bar" class="hidden fixed top-0 left-0 right-0 z-50 bg-slate-900/95 border-b border-amber-500/50 backdrop-blur-md px-4 py-2.5 shadow-2xl transition-all">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm">
            <div class="flex items-center gap-2 font-bold" style="color:#FCD34D;">
                <span class="px-2 py-0.5 bg-amber-500/20 border border-amber-400/40 rounded">🛠️ 教師外掛控制台</span>
                <span class="hidden xl:inline font-normal" style="color:#FDE68A;">可任意跳關、一鍵填入本關正解、隨機抽問或匯出 LaTeX 考卷</span>
            </div>
            <div class="flex flex-wrap items-center gap-1.5">
                <button onclick="switchScreen('home')" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 !text-slate-100 border border-slate-600 transition">首頁</button>
                <button onclick="switchScreen('level0')" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 !text-slate-100 border border-slate-600 transition">0.前導推導</button>
                <button onclick="switchScreen('level1')" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 !text-slate-100 border border-slate-600 transition">1.銳角</button>
                <button onclick="switchScreen('level2')" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 !text-slate-100 border border-slate-600 transition">2.直角與鈍角</button>
                <button onclick="switchScreen('rest')" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 !text-amber-300 border border-amber-500/40 transition">☕ 休息站</button>
                <button onclick="switchScreen('level3')" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 !text-slate-100 border border-slate-600 transition">3.綜合實戰</button>
                <span class="mx-1 text-slate-500">|</span>
                <button onclick="teacherAutoSolve()" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 !text-white font-bold shadow-lg transition">⚡ 一鍵通過本頁</button>
                <button onclick="toggleQuizGeneratorModal()" class="px-3 py-1 rounded bg-indigo-600 hover:bg-indigo-500 !text-white font-bold shadow-lg transition">🎲 隨機出題 ＆ 匯出 LaTeX</button>
                <button onclick="toggleTeacherMode()" class="ml-1 px-2 py-1 rounded bg-rose-800 hover:bg-rose-700 !text-white">關閉</button>
            </div>
        </div>
    </div>

    <!-- ================= 頂部進度導覽列與風格切換器 ================= -->
    <header class="sticky top-0 z-30 glass-card border-b border-slate-800/30 px-4 py-2.5">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <button id="header-home-btn" onclick="switchScreen('home')" class="hidden text-slate-400 hover:text-sky-400 transition flex items-center gap-1 text-xs sm:text-sm font-bold">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    返回首頁
                </button>
                <span class="font-bold text-sky-400 tracking-wide text-sm sm:text-base">📐 正弦定理互動實驗室</span>
            </div>

            <!-- 關卡進度條 -->
            <div id="game-progress-bar" class="hidden flex items-center gap-1.5 sm:gap-2.5">
                <div id="step-dot-0" class="flex items-center gap-1 text-xs font-medium text-slate-400">
                    <span class="w-6 h-6 rounded-full flex items-center justify-center border border-slate-600 bg-slate-800">0</span>
                    <span class="hidden xl:inline">高與面積</span>
                </div>
                <div class="w-2.5 sm:w-5 h-0.5 bg-slate-600/40"></div>
                <div id="step-dot-1" class="flex items-center gap-1 text-xs font-medium text-slate-400">
                    <span class="w-6 h-6 rounded-full flex items-center justify-center border border-slate-600 bg-slate-800">1</span>
                    <span class="hidden xl:inline">銳角</span>
                </div>
                <div class="w-2.5 sm:w-5 h-0.5 bg-slate-600/40"></div>
                <div id="step-dot-2" class="flex items-center gap-1 text-xs font-medium text-slate-400">
                    <span class="w-6 h-6 rounded-full flex items-center justify-center border border-slate-600 bg-slate-800">2</span>
                    <span class="hidden xl:inline">直角與鈍角</span>
                </div>
                <div class="w-2.5 sm:w-5 h-0.5 bg-slate-600/40"></div>
                <div id="step-dot-3" class="flex items-center gap-1 text-xs font-medium text-slate-400">
                    <span class="w-6 h-6 rounded-full flex items-center justify-center border border-slate-600 bg-slate-800">☕</span>
                    <span class="hidden xl:inline">休息站</span>
                </div>
                <div class="w-2.5 sm:w-5 h-0.5 bg-slate-600/40"></div>
                <div id="step-dot-4" class="flex items-center gap-1 text-xs font-medium text-slate-400">
                    <span class="w-6 h-6 rounded-full flex items-center justify-center border border-slate-600 bg-slate-800">3</span>
                    <span class="hidden xl:inline">測量實戰</span>
                </div>
            </div>

            <!-- 三大視覺主題切換器 -->
            <div class="flex items-center gap-1 glass-panel p-1 rounded-xl text-xs">
                <span class="px-1.5 text-slate-400 hidden sm:inline font-bold">風格：</span>
                <button onclick="setTheme('tech')" id="theme-btn-tech" class="px-2.5 py-1 rounded-lg bg-sky-600 !text-white font-bold transition shadow">🌌 科技星夜</button>
                <button onclick="setTheme('zen')" id="theme-btn-zen" class="px-2.5 py-1 rounded-lg text-slate-300 hover:bg-slate-500/20 font-medium transition">🌿 日式極簡</button>
                <button onclick="setTheme('parchment')" id="theme-btn-parchment" class="px-2.5 py-1 rounded-lg text-slate-300 hover:bg-slate-500/20 font-medium transition">📜 羊皮紙測量</button>
            </div>
        </div>
    </header>

    <!-- ================= 主內容區 ================= -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 md:p-8 relative z-10">

        <!-- ==================== 畫面 0：高質感視覺首頁 (新增 a=9 整數與三組真實數值比值對照面板) ==================== -->
        <section id="screen-home" class="max-w-6xl w-full mx-auto py-2">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10 items-center">
                
                <!-- 左側：主視覺文案與行動呼籲 -->
                <div class="lg:col-span-6 xl:col-span-7 space-y-6 text-left">
                    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-sky-500/15 border border-sky-500/30 text-sky-300 text-xs sm:text-sm font-bold">
                        <span class="w-2 h-2 rounded-full bg-sky-500 animate-ping"></span>
                        <span>高一數學三角比 ‧ 沉浸式幾何實驗室</span>
                    </div>

                    <h1 class="text-4xl sm:text-5xl xl:text-6xl font-black tracking-tight leading-[1.15]">
                        三角測量師的<br>
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-500 via-indigo-500 to-emerald-500">
                            幾何密室：正弦定理
                        </span><span onclick="toggleTeacherMode()" class="opacity-10 select-none cursor-default">.</span>
                    </h1>

                    <p class="text-slate-300 text-base sm:text-lg leading-relaxed max-w-2xl">
                        從十九世紀的海岸三角測量網、跨越高屏溪的斜張橋鋼索，到克卜勒推算火星軌道的奧秘——人類不需親自涉水過河，就能精準丈量世界。解開邊長 $a, b, c$ 與外接圓半徑 $R$ 之間的永恆比例吧
